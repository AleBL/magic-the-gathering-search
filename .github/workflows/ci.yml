name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # needed to post the coverage report comment on PRs

jobs:
  verify:
    name: Type-check, lint, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      # packageManager in package.json pins Yarn 4.17.1; Corepack activates it.
      - name: Enable Corepack
        run: corepack enable

      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type-check
        run: yarn type-check

      # Read-only lint (no --fix) so CI reports rather than silently rewrites code.
      - name: Lint
        run: yarn lint:check

      # Runs the suite and enforces the coverage thresholds set in vitest.config.ts;
      # the job fails here if coverage drops below the configured floor.
      - name: Test with coverage
        run: yarn test:coverage

      # Type-check does not exercise the bundlers: a change can compile and pass tests
      # while breaking the Vite build, the PWA/service-worker generation or the Electron
      # renderer. Both builds take a few seconds, so gate on them rather than finding out
      # at release time.
      - name: Build (web / PWA)
        run: yarn build:web

      # vite build via vite.config.ts (Electron renderer) + tsc for the main process.
      - name: Build (Electron)
        run: yarn build

      # Posts / updates a coverage summary comment on the PR and flags threshold status.
      # always() so the comment still lands when a later step above has failed.
      - name: Report coverage on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@v2

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Unit tests and type-checking are far cheaper; no point booting a browser to learn
    # the code does not compile.
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Playwright's own pinned chromium rather than the runner's Chrome, so a runner
      # image update cannot change what the suite is tested against.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: yarn test:e2e

      # The report is how you diagnose a failure you cannot reproduce locally.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
